name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: page "last updated" dates come from git
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: python3 site/build.py --base-url "${{ steps.pages.outputs.base_url }}" --out _site
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow
        if: vars.INDEXNOW_KEY != ''
        env:
          KEY: ${{ vars.INDEXNOW_KEY }}
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 30 # let the CDN pick up the new deployment
          site="${SITE%/}"
          host=$(echo "$site" | sed -E 's#^https?://([^/]+).*#\1#')
          urls=$(curl -fsSL "$site/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n -c --arg host "$host" --arg key "$KEY" --arg loc "$site/$KEY.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body"
